services:
  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: blackbox-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10

  etl:
    build:
      context: ./etl
    container_name: blackbox-etl
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./diary:/app/diary
      - "C:/Users/Bdfihn/Code:/app/git_repos:ro"
      - "C:/Users/Bdfihn/.claude/projects:/app/claude_transcripts:ro"
      - ./health_export:/app/iphone_export:ro
    environment:
      - QDRANT_HOST=blackbox-qdrant
      - QDRANT_PORT=6333
      - OLLAMA_HOST=host.docker.internal
      - OLLAMA_PORT=11434
      - ACTIVITYWATCH_HOST=host.docker.internal
      - ACTIVITYWATCH_PORT=5600
      - TIMEZONE=America/Chicago
      - TZ=America/Chicago
      - IPHONE_EXPORT_PATH=/app/iphone_export
      - GIT_REPOS_ROOT=/app/git_repos
      - CLAUDE_TRANSCRIPTS=/app/claude_transcripts
    extra_hosts:
      - "host.docker.internal:host-gateway"

  receiver:
    build:
      context: ./receiver
    container_name: blackbox-receiver
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./health_export:/app/health_export
    environment:
      - HEALTH_EXPORT_TOKEN=${HEALTH_EXPORT_TOKEN:-}
      - TIMEZONE=America/Chicago
      - TZ=America/Chicago

  query:
    build:
      context: ./query
    container_name: blackbox-query
    depends_on:
      - qdrant
    ports:
      - "8080:8080"
    volumes:
      - ./diary:/app/diary
    environment:
      - QDRANT_HOST=blackbox-qdrant
      - QDRANT_PORT=6333
      - OLLAMA_HOST=host.docker.internal
      - OLLAMA_PORT=11434
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  qdrant_data: